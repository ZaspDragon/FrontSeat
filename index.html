<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f452c"><meta name="description" content="FrontSeat commercial restaurant seating, waitlist, reservation and floor planning"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="v2/app.css?v=20260802-3"><title>FrontSeat Restaurant Operations</title></head><body><div id="app"><div class="boot">Loading FrontSeat…</div></div><noscript>FrontSeat requires JavaScript.</noscript><script>
(function(){
 const root=document.getElementById('app');
 const show=function(title,message){root.innerHTML='<div class="fatal"><div><h1>'+title+'</h1><p>'+message+'</p><button id="fs-reload">Reload</button><button id="fs-repair">Repair app cache</button></div></div>';document.getElementById('fs-reload').onclick=function(){location.reload()};document.getElementById('fs-repair').onclick=async function(){try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister()}))}if(window.caches){const keys=await caches.keys();await Promise.all(keys.map(function(k){return caches.delete(k)}))}}finally{location.href=location.pathname+'?repair='+Date.now()}}};
 window.addEventListener('error',function(e){if(!window.__frontseatBooted)show('FrontSeat failed to load',e.message||'A startup script failed.')});
 window.addEventListener('unhandledrejection',function(e){if(!window.__frontseatBooted)show('FrontSeat failed to load',String(e.reason&&e.reason.message||e.reason||'A startup promise failed.'))});
 const stamp=Date.now();
 import('./v2/main.js?v='+stamp).catch(function(err){console.error(err);show('FrontSeat module failed to load',String(err&&err.message||err))});
 setTimeout(function(){if(!window.__frontseatBooted&&!window.__frontseatBootFailed)show('FrontSeat startup timed out','Safari did not finish loading the application files. Tap Repair app cache, then reopen FrontSeat.')},10000);
})();
</script></body></html>
