<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6b3e26" />
  <meta name="description" content="FrontSeat restaurant host, waitlist, reservation, and seating management" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=stable-8" />
  <link rel="stylesheet" href="commercial.css?v=stable-8" />
  <link rel="stylesheet" href="layout-editor.css?v=stable-8" />
  <link rel="stylesheet" href="layout-mobile-controls.css?v=stable-8" />
  <link rel="stylesheet" href="stability.css?v=stable-8" />
  <title>FrontSeat Restaurant Operations</title>
</head>
<body>
  <div id="app"></div>
  <script>
    (function retireV2() {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        return Promise.all(registrations.map(function (registration) {
          var url = '';
          if (registration.active) url = registration.active.scriptURL || '';
          else if (registration.waiting) url = registration.waiting.scriptURL || '';
          else if (registration.installing) url = registration.installing.scriptURL || '';
          return url.indexOf('/sw-v2.js') !== -1 ? registration.unregister() : Promise.resolve(false);
        }));
      }).catch(function () {});
      if (window.caches) {
        caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (key) {
            return key.indexOf('frontseat-v2') !== -1;
          }).map(function (key) {
            return caches.delete(key);
          }));
        }).catch(function () {});
      }
    })();
  </script>
  <script src="stability.js?v=stable-8"></script>
  <script src="app.js?v=stable-8" defer></script>
  <script src="commercial.js?v=stable-8" defer></script>
  <script src="layout-editor.js?v=stable-8" defer></script>
  <script src="layout-mobile-controls.js?v=stable-8" defer></script>
</body>
</html>
