<!doctype html><meta charset="utf-8"><title>FrontSeat v2 smoke tests</title><pre id="out">Running…</pre><script type="module">import{openDB,setDoc,getDoc,migrateLegacy}from'../v2/storage.js';import{initStore,getState,update,undoAction}from'../v2/store.js';const out=document.getElementById('out'),results=[];const test=async(name,fn)=>{try{await fn();results.push(`✓ ${name}`)}catch(e){results.push(`✗ ${name}: ${e.message}`)}};await test('IndexedDB opens',async()=>{if(!(await openDB()))throw Error('No database')});await test('Document round trip',async()=>{await setDoc('test',{ok:true});if(!(await getDoc('test')).ok)throw Error('Round trip failed')});await test('Store initializes',async()=>{await initStore();if(!Array.isArray(getState().tables))throw Error('Tables missing')});await test('State updates',async()=>{const before=getState().tables.length;await update(s=>s.tables.push({id:'test-table',number:'99',capacity:2,x:0,y:0,width:100,height:80,rotation:0,shape:'round',section:'Test',status:'available'}));if(getState().tables.length!==before+1)throw Error('Update failed')});await test('Undo restores state',async()=>{await undoAction();if(getState().tables.some(t=>t.id==='test-table'))throw Error('Undo failed')});out.textContent=results.join('\n');document.body.dataset.passed=results.every(x=>x.startsWith('✓'))?'true':'false';</script>
